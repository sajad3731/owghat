name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test OwghatCore & Build App
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run OwghatCore tests
        working-directory: Packages/OwghatCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Owghat app and widget
        run: >
          xcodebuild build
          -project Owghat.xcodeproj
          -scheme Owghat
          -configuration Debug
          -destination "platform=macOS"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      # Unsigned Release build for local installs. Skipped on pull requests to keep them fast.
      - name: Build Release app
        if: github.event_name != 'pull_request'
        run: >
          xcodebuild build
          -project Owghat.xcodeproj
          -scheme Owghat
          -configuration Release
          -destination "generic/platform=macOS"
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: Package Release app
        if: github.event_name != 'pull_request'
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Owghat.app Owghat.zip

      - name: Upload Release app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Owghat-app
          path: Owghat.zip
          retention-days: 14
